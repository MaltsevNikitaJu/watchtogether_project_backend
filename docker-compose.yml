version: '3.8'

services:

  postgres:
    image: postgres:18-alpine
    container_name: watchtogether_db
    environment:
      POSTGRES_USER: ${DB_USER}       
      POSTGRES_PASSWORD: ${DB_PASSWORD}  
      POSTGRES_DB: ${DB_NAME} 
    ports:
      - "5432:5432"              
    volumes:
      - postgres_data:/var/lib/postgresql/data 

  redis:
    image: redis:alpine
    container_name: watchtogether_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data: